x-app-build: &app-build
  context: .
  dockerfile: docker/Dockerfile

x-runtime-arg: &runtime-arg
  BASE_IMAGE: parse/jvm-runtime:21

services:
  artemis:
    image: apache/activemq-artemis:2.37.0
    container_name: artemis
    ports:
      - "61616:61616" # JMS / CORE
      - "8161:8161" # Web console (http://localhost:8161)
    environment:
      ARTEMIS_USER: artemis
      ARTEMIS_PASSWORD: artemis

  producer-json:
    build:
      <<: *app-build
      args:
        <<: *runtime-arg
        APP_MODULE: producer-json-app
    environment:
      ARTEMIS_BROKER_URL: tcp://artemis:61616
      SERVER_PORT: "8080"
    ports:
      - "8081:8080"
    depends_on:
      - artemis

  producer-xml:
    build:
      <<: *app-build
      args:
        <<: *runtime-arg
        APP_MODULE: producer-xml-app
    environment:
      ARTEMIS_BROKER_URL: tcp://artemis:61616
      SERVER_PORT: "8080"
    ports:
      - "8082:8080"
    depends_on:
      - artemis

  consumer-json:
    build:
      <<: *app-build
      args:
        <<: *runtime-arg
        APP_MODULE: consumer-json-app
    environment:
      ARTEMIS_BROKER_URL: tcp://artemis:61616
      SERVER_PORT: "8080"
    ports:
      - "8083:8080"
    depends_on:
      - artemis

  consumer-xml:
    build:
      <<: *app-build
      args:
        <<: *runtime-arg
        APP_MODULE: consumer-xml-app
    environment:
      ARTEMIS_BROKER_URL: tcp://artemis:61616
      SERVER_PORT: "8080"
    ports:
      - "8084:8080"
    depends_on:
      - artemis
