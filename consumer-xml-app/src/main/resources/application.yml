spring:
  application:
    name: consumer-xml
  artemis:
    mode: native
    broker-url: ${ARTEMIS_BROKER_URL:tcp://127.0.0.1:61616}
    user: ${ARTEMIS_USER:artemis}
    password: ${ARTEMIS_PASSWORD:artemis}
  jms:
    pub-sub-domain: true
    cache:
      enabled: false
    client-id: consumer-xml-app
    subscription-durable: true

server:
  port: ${SERVER_PORT:8080}

app:
  jms:
    topic: app.messages.xml
    dlq: app.messages.xml.DLQ
    listener-id: consumer-xml
    durable-subscription: consumer-xml-messages
    retry:
      max-attempts: 3
      initial-interval-ms: 200
      multiplier: 2.0

logging:
  level:
    root: INFO
    org.acme.parse: INFO
